<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MobilKalbim.com - Mobil & Web Sesli Sohbet Paneli</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #0d0614 url('https://picsum.photos/1920/1080?dark') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #fff;
        }

        /* Karartma Katmanı */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 5, 15, 0.85);
            z-index: 0;
        }

        /* Üst Header / Logo Alanı */
        header {
            position: relative;
            z-index: 1;
            width: 100%;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 2px solid #e11d48;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-text {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
        }

        .logo-text span {
            color: #e11d48;
        }

        /* Dönen Duyuru Bandı */
        .marquee-container {
            position: relative;
            z-index: 1;
            background: #e11d48;
            color: #fff;
            padding: 6px 0;
            font-size: 13px;
            font-weight: bold;
            overflow: hidden;
            white-space: nowrap;
        }

        .marquee-text {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 15s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        /* Ana İçerik / Klasik Panel Kutu Yerleşimi */
        main {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 20px;
        }

        .login-box {
            width: 360px;
            background: rgba(20, 10, 25, 0.95);
            border: 2px solid #e11d48;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(225, 29, 72, 0.4);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(90deg, #be123c, #fb7185);
            padding: 12px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #ccc;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            background: #180d24;
            border: 1px solid #4c1d95;
            border-radius: 5px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .form-control:focus {
            border-color: #fb7185;
        }

        /* Butonlar */
        .btn-panel {
            width: 100%;
            padding: 12px;
            background: #e11d48;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .btn-panel:hover {
            background: #be123c;
        }

        .btn-guest {
            background: #334155;
            margin-top: 8px;
        }

        .btn-guest:hover {
            background: #475569;
        }

        /* Alt Bilgi */
        footer {
            position: relative;
            z-index: 1;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            text-align: center;
            font-size: 12px;
            color: #888;
            border-top: 1px solid #222;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <!-- Üst Bar -->
    <header>
        <div class="logo-text">SESLİ<span>MEKAN</span>.COM</div>
        <div style="font-size: 12px; color: #4ade80;">● Canlı Sunucu Aktif</div>
    </header>

    <!-- Duyuru Bandı -->
    <div class="marquee-container">
        <div class="marquee-text">
            HOŞ GELDİNİZ! MOBİLKALBİM SESLİ VE GÖRÜNTÜLÜ SOHBET PANELİNE BAĞLANMAKTASINIZ. KEYİFLİ SOHBETLER DİLERİZ...
        </div>
    </div>

    <!-- Klasik Panel Giriş Kutusunun Olduğu Orta Alan -->
    <main>
        <div class="login-box">
            <div class="login-header">
                Sohbet Giriş Paneli
            </div>
            <div class="login-body">
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="nick">NICK / KULLANICI ADI</label>
                        <input type="text" id="nick" class="form-control" placeholder="Rumuz giriniz..." required>
                    </div>

                    <div class="form-group">
                        <label for="room">GİRİŞ KANALI</label>
                        <select id="room" class="form-control">
                            <option value="1">Lobi / Genel Sohbet</option>
                            <option value="2">Müzik Odası</option>
                            <option value="3">Damar Odası</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-panel">SOHBETE GİRİŞ YAP</button>
                    <button type="button" class="btn-panel btn-guest" onclick="quickGuest()">MİSAFİR GİRİŞİ</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        Mobilkalbim.com © Sesli Chat ve Mobil Panel Sistemleri.
    </footer>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const nick = document.getElementById('nick').value;
            alert(nick + " rumuzu ile Mobilkalbim sohbet odalarına bağlanılıyor...");
        }

        function quickGuest() {
            document.getElementById('nick').value = 'Misafir_' + Math.floor(1000 + Math.random() * 9000);
        }
    </script>

</body>
</html>
