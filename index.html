<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segital Sesli Chat & Radyo Portalı</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sol Menü / Yan Panel */
        .sidebar {
            width: 260px;
            background-color: #1e293b;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #334155;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 10px;
        }

        .room-list {
            list-style: none;
            margin-bottom: 20px;
        }

        .room-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 5px;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .room-item:hover, .room-item.active {
            background-color: #334155;
            color: #38bdf8;
        }

        .room-badge {
            background-color: #0284c7;
            color: white;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
        }

        /* Orta Panel - Ses & Görsel Alanı */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 100%);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #334155;
        }

        .visualizer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        /* Ses Dalgası Simülasyonu */
        .wave-container {
            display: flex;
            align-items: center;
            gap: 5px;
            height: 80px;
            margin-bottom: 20px;
        }

        .bar {
            width: 8px;
            background-color: #38bdf8;
            border-radius: 4px;
            animation: pulse 1.2s infinite ease-in-out;
        }

        .bar:nth-child(1) { height: 30px; animation-delay: 0.1s; }
        .bar:nth-child(2) { height: 60px; animation-delay: 0.3s; }
        .bar:nth-child(3) { height: 40px; animation-delay: 0.2s; }
        .bar:nth-child(4) { height: 75px; animation-delay: 0.4s; }
        .bar:nth-child(5) { height: 50px; animation-delay: 0.1s; }
        .bar:nth-child(6) { height: 20px; animation-delay: 0.5s; }

        @keyframes pulse {
            0%, 100% { transform: scaleY(0.4); }
            50% { transform: scaleY(1.1); }
        }

        /* Kontrol Paneli */
        .controls {
            background-color: #1e293b;
            padding: 15px 25px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn:hover {
            background-color: #0369a1;
        }

        .btn-danger {
            background-color: #e11d48;
        }

        .btn-danger:hover {
            background-color: #be123c;
        }

        /* Sağ Panel - Canlı Sohbet */
        .chat-sidebar {
            width: 320px;
            background-color: #1e293b;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #334155;
        }

        .chat-header {
            padding: 15px;
            border-bottom: 1px solid #334155;
            font-weight: bold;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            background-color: #334155;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .message .username {
            font-weight: bold;
            color: #38bdf8;
            font-size: 0.8rem;
            margin-bottom: 3px;
        }

        .chat-input-area {
            padding: 15px;
            border-top: 1px solid #334155;
            display: flex;
            gap: 8px;
        }

        .chat-input {
            flex: 1;
            background-color: #0f172a;
            border: 1px solid #334155;
            padding: 10px;
            border-radius: 6px;
            color: white;
            outline: none;
        }

        .chat-input:focus {
            border-color: #38bdf8;
        }
    </style>
</head>
<body>

    <!-- Sol Kanal Listesi -->
    <div class="sidebar">
        <div class="brand">🎙️ Segital Live</div>
        <div class="menu-title">Sesli Kanallar</div>
        <ul class="room-list">
            <li class="room-item active">
                <span>🎵 Müzik Odası</span>
                <span class="room-badge">12</span>
            </li>
            <li class="room-item">
                <span>💬 Genel Sohbet</span>
                <span class="room-badge">5</span>
            </li>
            <li class="room-item">
                <span>📻 Canlı Yayın</span>
                <span class="room-badge">28</span>
            </li>
        </ul>
    </div>

    <!-- Orta Canlı Yayın & Ses Alanı -->
    <div class="main-content">
        <div class="header">
            <h2>Aktif Oda: Müzik Odası</h2>
            <span style="color: #22c55e;">● Yayın Canlı</span>
        </div>

        <div class="visualizer-container">
            <div class="wave-container">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <p id="status-text">Yayın dinleniyor...</p>
        </div>

        <div class="controls">
            <button class="btn" onclick="toggleMic()" id="mic-btn">🎤 Mikrofonu Aç</button>
            <button class="btn btn-danger">🚫 Yayından Çık</button>
        </div>
    </div>

    <!-- Sağ Sohbet Alanı -->
    <div class="chat-sidebar">
        <div class="chat-header">Oda Yazışmaları</div>
        <div class="chat-messages" id="chat-box">
            <div class="message">
                <div class="username">DJ_Ahmet</div>
                <div>Herkese selamlar, hoş geldiniz!</div>
            </div>
            <div class="message">
                <div class="username">User123</div>
                <div>Harika bir yayın oluyor, elinize sağlık.</div>
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chat-input" placeholder="Mesajınızı yazın..." onkeypress="handleKeyPress(event)">
            <button class="btn" onclick="sendMessage()">Gönder</button>
        </div>
    </div>

    <script>
        // Basit Sohbet Gönderme Fonksiyonu
        function sendMessage() {
            const input = document.getElementById('chat-input');
            const messageText = input.value.trim();
            
            if (messageText !== '') {
                const chatBox = document.getElementById('chat-box');
                const newMessage = document.createElement('div');
                newMessage.className = 'message';
                newMessage.innerHTML = `<div class="username">Sen</div><div>${messageText}</div>`;
                
                chatBox.appendChild(newMessage);
                input.value = '';
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        // Mikrofon Aç/Kapat Simülasyonu
        let isMicOpen = false;
        function toggleMic() {
            const btn = document.getElementById('mic-btn');
            const status = document.getElementById('status-text');
            
            isMicOpen = !isMicOpen;
            if (isMicOpen) {
                btn.innerText = "🎙️ Mikrofonu Kapat";
                btn.style.backgroundColor = "#e11d48";
                status.innerText = "Konuşuyorsunuz (Yayındasınız)...";
            } else {
                btn.innerText = "🎤 Mikrofonu Aç";
                btn.style.backgroundColor = "#0284c7";
                status.innerText = "Yayın dinleniyor...";
            }
        }
    </script>
</body>
</html>
