<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mobilkalbim.com - Türkiye'nin Sesli Sohbet ve Müzik Portalı</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1b0f1b 0%, #0a050a 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
            overflow: hidden;
        }

        /* Üst Header / Navigasyon */
        .top-bar {
            width: 100%;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 10, 20, 0.6);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 0, 85, 0.2);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ff0055;
            text-shadow: 0 0 12px rgba(255, 0, 85, 0.6);
        }

        .logo span {
            color: #ffffff;
        }

        .top-links a {
            color: #cccccc;
            text-decoration: none;
            margin-left: 20px;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .top-links a:hover {
            color: #ff0055;
        }

        /* Arka Plan Parlama Efekti */
        .glow-effect {
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(255, 0, 85, 0.12);
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
        }

        /* Orta Giriş Kartı */
        .main-container {
            position: relative;
            z-index: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .panel-card {
            background: rgba(25, 15, 25, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 0, 85, 0.3);
            width: 400px;
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 0, 85, 0.15);
            text-align: center;
        }

        .panel-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .panel-subtitle {
            font-size: 0.85rem;
            color: #a090a0;
            margin-bottom: 25px;
        }

        /* Nick Avatarları */
        .avatar-selection {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .avatar-box {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #2a152a;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .avatar-box:hover, .avatar-box.active {
            border-color: #ff0055;
            transform: scale(1.1);
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.5);
        }

        /* Input Form */
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #d0c0d0;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            background: #120812;
            border: 1px solid #3a203a;
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
        }

        .form-input:focus {
            border-color: #ff0055;
            box-shadow: 0 0 8px rgba(255, 0, 85, 0.4);
        }

        /* Giriş Butonları */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff0055 0%, #b3003b 100%);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
            margin-top: 5px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #e6004c 0%, #990033 100%);
            transform: translateY(-2px);
        }

        .btn-guest {
            background: transparent;
            border: 1px solid #3a203a;
            color: #b0a0b0;
            margin-top: 10px;
            box-shadow: none;
        }

        .btn-guest:hover {
            background: rgba(255, 0, 85, 0.1);
            color: #ffffff;
            border-color: #ff0055;
        }

        /* Çevrimiçi Sayaç */
        .online-status {
            margin-top: 22px;
            font-size: 0.8rem;
            color: #00ffcc;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00ffcc;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ffcc;
        }

        /* Alt Bilgi (Footer) */
        .footer {
            padding: 15px;
            font-size: 0.75rem;
            color: #665566;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo">Sesli<span>mobilkalbim.com</span></div>
        <div class="top-links">
            <a href="#">Ana Sayfa</a>
            <a href="#">Oda Listesi</a>
            <a href="#">Yardım / İletişim</a>
        </div>
    </div>

    <div class="glow-effect"></div>

    <div class="main-container">
        <div class="panel-card">
            <div class="panel-title">Sohbet Panelimiz</div>
            <div class="panel-subtitle">Sesli & Görüntülü Sohbet Odalarına Bağlanın</div>

            <!-- Avatar Seçim Alanı -->
            <div class="avatar-selection">
                <div class="avatar-box active" onclick="pickAvatar(this)">👑</div>
                <div class="avatar-box" onclick="pickAvatar(this)">🎧</div>
                <div class="avatar-box" onclick="pickAvatar(this)">🎤</div>
                <div class="avatar-box" onclick="pickAvatar(this)">😎</div>
            </div>

            <form onsubmit="enterSite(event)">
                <div class="form-group">
                    <label for="nickname">Kullanıcı Adı / Rumuz</label>
                    <input type="text" id="nickname" class="form-input" placeholder="Rumuzunuzu yazınız..." required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="room-select">Giriş Yapılacak Kanal</label>
                    <select id="room-select" class="form-input">
                        <option value="1">🎵 Müzik Odası (Yayın Canlı)</option>
                        <option value="2">💬 Genel Sohbet Odası</option>
                        <option value="3">🔥 VIP Odası</option>
                        <option value="4">💛 Aşk Odası</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">SOHBETE GİRİŞ YAP</button>
                <button type="button" class="btn-submit btn-guest" onclick="quickGuest()">Misafir Olarak Katıl</button>
            </form>

            <div class="online-status">
                <span class="status-dot"></span>
                <span>Şu an **54** Kullanıcı Odalarda Aktif</span>
            </div>
        </div>
    </div>

    <div class="footer">
        © 2026 mobilkalbim.com - Tüm Hakları Saklıdır. Sesli Sohbet Portal Altyapısı.
    </div>

    <script>
        function pickAvatar(element) {
            document.querySelectorAll('.avatar-box').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }

        function enterSite(e) {
            e.preventDefault();
            const nick = document.getElementById('nickname').value;
            alert('Hoş geldin ' + nick + '! mobilkalbim sohbet odalarına yönlendiriliyorsunuz...');
            // Gerçek panel sayfasına yönlendirmek için:
            // window.location.href = "panel.html";
        }

        function quickGuest() {
            const randomGuest = 'Misafir_' + Math.floor(Math.random() * 899 + 100);
            document.getElementById('nickname').value = randomGuest;
        }
    </script>
</body>
</html>
