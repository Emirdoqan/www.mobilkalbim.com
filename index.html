<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROTİNDA BAŞKAN</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            /* Ekrandaki dağ ve yıldızlı gece gökyüzü arka planı */
            background: #050508 url('https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1920') no-repeat center bottom fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            color: #ffffff;
        }

        /* Üst Siyah Bar */
        header {
            width: 100%;
            height: 40px;
            background-color: #000000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
        }

        .logo {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: #ff2a5f;
        }

        .server-status {
            font-size: 11px;
            color: #00ff66;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Pembe Kayan Yazı Bandı */
        .marquee-bar {
            width: 100%;
            height: 26px;
            background-color: #ff2a5f;
            display: flex;
            align-items: center;
            overflow: hidden;
            white-space: nowrap;
            z-index: 9;
        }

        .marquee-text {
            font-size: 12px;
            font-weight: bold;
            color: #ffffff;
            padding-left: 100%;
            animation: marquee 20s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        /* Orta Alan & Giriş Kutusu */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Ekrandaki Parlayan Pembe Çerçeveli Kutu */
        .login-card {
            width: 380px;
            background-color: #121018;
            border: 1.5px solid #ff2a5f;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 42, 95, 0.6), inset 0 0 10px rgba(255, 42, 95, 0.2);
            overflow: hidden;
        }

        /* Pembe Başlık Alanı */
        .card-header {
            background-color: #ff2a5f;
            color: #ffffff;
            text-align: center;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Kutu İçeriği */
        .card-body {
            padding: 25px 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: #cccccc;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            height: 38px;
            background-color: #181524;
            border: 1px solid #33264c;
            border-radius: 4px;
            padding: 0 10px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
        }

        .form-input::placeholder {
            color: #665c7a;
        }

        .form-input:focus {
            border-color: #ff2a5f;
        }

        /* Butonlar */
        .btn {
            width: 100%;
            height: 40px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-pink {
            background-color: #ff2a5f;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .btn-gray {
            background-color: #3b4554;
            color: #ffffff;
        }

        /* Alt Siyah Bar (Footer) */
        footer {
            width: 100%;
            height: 25px;
            background-color: #000000;
            text-align: center;
            line-height: 25px;
            font-size: 10px;
            color: #666666;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- Siyah Üst Bar -->
    <header>
        <div class="logo">MOBİL<span>KALBİM.COM</span></div>
        <div class="server-status">● Canlı Sunucu Aktif</div>
    </header>

    <!-- Pembe Duyuru Bandı -->
    <div class="marquee-bar">
        <div class="marquee-text">
            HOŞ GELDİNİZ! MOBİLKALBİM SESLİ VE GÖRÜNTÜLÜ SOHBET PANELİNE BAĞLANMAKTASINIZ. KEYİFLİ SOHBETLER DİLERİZ...
        </div>
    </div>

    <!-- Giriş Paneli -->
    <main>
        <div class="login-card">
            <div class="card-header">
                SOHBET GİRİŞ PANELİ
            </div>
            <div class="card-body">
                <form onsubmit="event.preventDefault();">
                    <div class="form-group">
                        <label>NICK / KULLANICI ADI</label>
                        <input type="text" class="form-input" placeholder="Rumuz giriniz...">
                    </div>

                    <div class="form-group">
                        <label>GİRİŞ KANALI</label>
                        <select class="form-input">
                            <option>Lobi / Genel Sohbet</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-pink">SOHBETE GİRİŞ YAP</button>
                    <button type="button" class="btn btn-gray">MİSAFİR GİRİŞİ</button>
                </form>
            </div>
        </div>
    </main>

    <!-- Alt Bilgi -->
    <footer>
        Mobilkalbim.com © Sesli Chat ve Mobil Panel Sistemleri
    </footer>

</body>
</html>
